# OpenSSF Scorecard: scores this repository's supply chain practices and
# publishes the result to api.scorecard.dev, which serves the README badge.
#
# Publishing only works if this workflow follows Scorecard's rules: no
# workflow-level env, defaults or write permissions, and the analysis job may
# only use the actions listed below (no run steps). See
# https://github.com/ossf/scorecard-action#workflow-restrictions
name: scorecard

on:
  # Branch-Protection is only scored on the default branch.
  branch_protection_rule:
  # Keeps the Maintained check current even in weeks with no pushes.
  schedule:
    - cron: "15 14 * * 0"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}
# Blocks all cache access. Taken from Scorecard's own example workflow.
cache-mode: none

jobs:
  analysis:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # sign the results published to api.scorecard.dev
    steps:
      # Pinned to commit SHAs, like release.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
