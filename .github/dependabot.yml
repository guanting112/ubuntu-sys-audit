# Dependabot opens pull requests for new Go modules and for new versions of
# the actions in .github/workflows, updating their SHA pins and comments.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # A new version is proposed only after it has been out for a week, so one
    # that is pulled for being malicious or broken does not reach the binary.
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
    ignore:
      # A nested module of golang.org/x/crypto that has only pseudo-versions.
      # Dependabot takes it for x/crypto, asks for x/crypto's latest tag and
      # fails every run, so update it by hand:
      #   go get golang.org/x/crypto/x509roots/fallback@latest
      - dependency-name: golang.org/x/crypto/x509roots/fallback

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
